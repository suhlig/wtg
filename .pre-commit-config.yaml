---
repos:
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: bash -c 'go fmt ./... && git diff --exit-code -- "*.go"'
        language: system
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        entry: bash -c 'go mod tidy && git diff --exit-code go.mod go.sum'
        language: system
        pass_filenames: false
      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run ./...
        language: system
        pass_filenames: false
      - id: gosec
        name: go tool gosec
        entry: go tool gosec ./...
        language: system
        pass_filenames: false
      - id: govulncheck
        name: go tool govulncheck
        entry: go tool govulncheck ./...
        language: system
        pass_filenames: false
      - id: go-fix
        name: go fix
        entry: bash -c 'go fix ./... && git diff --exit-code -- "*.go"'
        language: system
        pass_filenames: false
      - id: go-test
        name: go test
        entry: go test ./...
        language: system
        pass_filenames: false
        always_run: true
