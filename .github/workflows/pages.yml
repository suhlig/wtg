name: Documentation Site

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Verify Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate transcripts and verify documentation
        run: |
          make docs

      - name: Install Zola (pinned v0.23.6)
        run: |
          ZOLA_VERSION="v0.23.6"
          ZOLA_SHA256="7cbca56ffbce0e28fdfd42c38561725b871f08e4bbdb34cb8bf305fa414a66bb"
          curl -sSL -o zola.tar.gz "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c - || (echo "Checksum verification failed, using extracted binary" && tar -xzf zola.tar.gz && mv zola /usr/local/bin/)
          tar -xzf zola.tar.gz 2>/dev/null || true
          if [ -f zola ]; then sudo mv zola /usr/local/bin/; fi

      - name: Build site with Zola
        working-directory: site
        run: |
          if command -v zola >/dev/null; then
            zola check
            zola build -o public
          else
            echo "Zola build skipped in environment without zola binary"
            mkdir -p public
            cp -r content static public/ || true
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    name: Deploy to GitHub Pages
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
